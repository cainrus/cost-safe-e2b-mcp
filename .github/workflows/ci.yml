name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No lockfile is committed, so this resolves the declared ranges fresh —
      # which also makes the job fail when a dependency range stops resolving.
      - run: npm install --no-audit --no-fund
      # The suite drives lib/run-code-tool.mjs with a fake sandbox, so it needs
      # no E2B_API_KEY and no network. It still parse-checks server.mjs, which
      # cannot be imported directly — importing it would start the stdio server.
      - run: npm test
